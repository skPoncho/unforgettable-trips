# Construye las imágenes y corre lint y pruebas dentro de los contenedores,
# con los mismos comandos que en local (make lint / make test).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Preparar .env
        run: cp .env.example .env

      # Descargas de Natural Earth y GeoNames (~250 MB) que usan las pruebas de geo.
      - name: Caché de datos geográficos
        uses: actions/cache@v4
        with:
          path: ~/.cache/huella/geo
          key: geo-${{ hashFiles('api/data/natural_earth.json') }}
          restore-keys: geo-

      - name: Construir imágenes
        run: docker compose build

      - name: Lint
        run: make lint

      # Los tipos del web se generan desde el OpenAPI; si la API cambió, hay que regenerarlos.
      - name: Tipos de la API al día
        run: make gen-api && git diff --exit-code -- web/src/app/core/api

      - name: Pruebas
        run: make test

      - name: Logs si algo falla
        if: failure()
        run: docker compose logs

      - name: Limpiar
        if: always()
        run: docker compose down -v
