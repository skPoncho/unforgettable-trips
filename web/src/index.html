<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <title>Huella</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Aplica el tema antes de pintar para evitar el parpadeo. Debe coincidir con ThemeService. -->
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('huella.theme');
        } catch (e) {}
        var theme =
          pref === 'dark' || pref === 'light'
            ? pref
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
