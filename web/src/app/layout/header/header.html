<header class="header">
  <a class="brand" routerLink="/" aria-label="Huella, ir a Mundo">
    <svg class="brand__logo" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <circle class="brand__disc" cx="17" cy="17" r="16" />
      <path class="brand__pin" d="M17 8c-4 0-7 3-7 7 0 5 7 11 7 11s7-6 7-11c0-4-3-7-7-7z" />
      <circle class="brand__disc" cx="17" cy="15" r="2.6" />
    </svg>
    <span class="brand__name">huella</span>
  </a>

  <nav class="views" aria-label="Vistas del mapa">
    @for (view of views; track view.label) {
      <a
        class="views__link"
        [routerLink]="'/' + view.path"
        [queryParams]="view.tab ? { pestana: view.tab } : null"
        [class.is-active]="active() === view"
        [attr.aria-current]="active() === view ? 'page' : null"
        >{{ view.label }}</a
      >
    }
  </nav>

  <!-- Búsqueda (fase 7) y compartir (fase 8): visibles pero aún sin acción. -->
  <label class="search" title="Próximamente · fase 7">
    <svg lucideSearch [size]="18" aria-hidden="true"></svg>
    <span class="visually-hidden">Buscar (próximamente)</span>
    <input
      class="search__input"
      type="search"
      placeholder="Busca un lugar, un viaje o un recuerdo…"
      readonly
      aria-disabled="true"
    />
  </label>

  <div class="actions">
    <button type="button" class="pill-button" aria-disabled="true" title="Próximamente · fase 8">
      <svg lucideShare2 [size]="17" aria-hidden="true"></svg>
      Compartir mi mapa
    </button>
    <a class="pill-button pill-button--primary" routerLink="/nuevo-recuerdo">
      <svg lucidePlus [size]="18" [strokeWidth]="2.4" aria-hidden="true"></svg>
      Nuevo recuerdo
    </a>
    <button
      type="button"
      class="round-button theme-toggle"
      [attr.aria-label]="themeLabel()"
      [attr.title]="themeLabel()"
      (click)="theme.toggle()"
    >
      @if (isDark()) {
        <svg lucideSun [size]="19" aria-hidden="true"></svg>
      } @else {
        <svg lucideMoon [size]="19" aria-hidden="true"></svg>
      }
    </button>
    <app-profile-menu />
  </div>
</header>
